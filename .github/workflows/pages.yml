name: Pages

# Builds the release page and publishes it on GitHub Pages. Runs when a tag that starts with v is pushed, and when started by hand.
# Settings needed once: Pages source "GitHub Actions", and a tag rule v* under Settings > Environments > github-pages. See RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag matches the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match the newest CHANGELOG.md entry ($v)"; exit 1; }
      - name: Static tests
        run: |
          pip install numpy pillow pandas
          for t in license mlcfigs style structure takeaway facts problems plan abrstyle numbers numbers2 numbers3 numbers4 numbers5 numbers6 numbers7 numbers8 numbers9 numbers10 numbers11 numbers12 numbers13 numbers14 numbers15 numbers16 tapquality mudata casedata noslider realdata; do
            echo "== $t"; python tests/$t.py || exit 1
          done
      - name: Build the release page
        run: python build.py --release
      - name: Stage the site
        run: |
          mkdir _site
          cp dist/ro-physics.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
